syntax = "proto3";
package qorechain.gasabstraction.v1;

option go_package = "github.com/qorechain/qorechain-core/x/gasabstraction/types";

import "cosmos/base/v1beta1/coin.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";
import "qorechain/gasabstraction/v1/gasabstraction.proto";

// Msg defines the gas abstraction module's transaction service.
service Msg {
  option (cosmos.msg.v1.service) = true;

  // UpdateConfig replaces the configuration. Governance-only. This is how a
  // real (ibc/<hash>) fee token and its pool are added and conversion is
  // opened.
  rpc UpdateConfig(MsgUpdateConfig) returns (MsgUpdateConfigResponse);

  // FundFloat moves native tokens from the sender into the conversion float.
  // The float is a module account and refuses ordinary bank sends; this is
  // how it is funded, for example by an account that received a community
  // pool spend for the purpose.
  rpc FundFloat(MsgFundFloat) returns (MsgFundFloatResponse);
}

// MsgUpdateConfig replaces the gas abstraction configuration wholesale.
message MsgUpdateConfig {
  option (cosmos.msg.v1.signer) = "authority";

  // authority must be the governance module account.
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  FeeConfig config = 2 [(gogoproto.nullable) = false];
}

message MsgUpdateConfigResponse {}

// MsgFundFloat moves amount from sender into the conversion float.
message MsgFundFloat {
  option (cosmos.msg.v1.signer) = "sender";

  string sender = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // amount must be in the native denom.
  cosmos.base.v1beta1.Coin amount = 2 [(gogoproto.nullable) = false];
}

message MsgFundFloatResponse {}
