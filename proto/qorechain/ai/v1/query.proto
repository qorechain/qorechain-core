syntax = "proto3";
package qorechain.ai.v1;

option go_package = "github.com/qorechain/qorechain-core/x/ai/types";

import "google/api/annotations.proto";

// Query defines the gRPC query service for the ai module.
service Query {
  // Config returns the AI engine configuration.
  rpc Config(QueryConfigRequest) returns (QueryConfigResponse) {
    option (google.api.http).get = "/qorechain/ai/v1/config";
  }
  // Stats returns the AI engine runtime statistics.
  rpc Stats(QueryStatsRequest) returns (QueryStatsResponse) {
    option (google.api.http).get = "/qorechain/ai/v1/stats";
  }
  // FlaggedTx returns the screening record of a transaction the anomaly
  // scoring flagged, if it is still kept.
  rpc FlaggedTx(QueryFlaggedTxRequest) returns (QueryFlaggedTxResponse) {
    option (google.api.http).get = "/qorechain/ai/v1/flagged/{tx_hash}";
  }
}

message ConfigView {
  string anomaly_threshold = 1;
  string routing_strategy = 2;
  string risk_threshold = 3;
  int32 max_tx_per_minute = 4;
  // max_evm_tx_per_minute is the EVM-lane limit; zero means max_tx_per_minute.
  int32 max_evm_tx_per_minute = 5;
  // anomaly_action is "flag" (the default when empty) or "reject".
  string anomaly_action = 6;
}

message StatsView {
  uint64 txs_routed = 1;
  uint64 anomalies_detected = 2;
  uint64 contracts_scored = 3;
  uint64 txs_flagged = 4;
  uint64 txs_rejected = 5;
}

message QueryConfigRequest {}
message QueryConfigResponse { ConfigView config = 1; }

message QueryStatsRequest {}
message QueryStatsResponse { StatsView stats = 1; }

// FlaggedTxView is a flagged transaction's screening record.
message FlaggedTxView {
  string tx_hash = 1;
  // anomaly_score is the score in [0, 1] as a decimal string.
  string anomaly_score = 2;
  repeated string flags = 3;
  int64 height = 4;
}

message QueryFlaggedTxRequest { string tx_hash = 1; }
message QueryFlaggedTxResponse {
  bool found = 1;
  FlaggedTxView flagged = 2;
}
