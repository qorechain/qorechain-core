syntax = "proto3";
package qorechain.ai.v1;

option go_package = "github.com/qorechain/qorechain-core/x/ai/types";

import "google/api/annotations.proto";

// Query defines the gRPC query service for the ai module.
service Query {
  // Config returns the AI engine configuration.
  rpc Config(QueryConfigRequest) returns (QueryConfigResponse) {
    option (google.api.http).get = "/qorechain/ai/v1/config";
  }
  // Stats returns the AI engine runtime statistics.
  rpc Stats(QueryStatsRequest) returns (QueryStatsResponse) {
    option (google.api.http).get = "/qorechain/ai/v1/stats";
  }
  // FlaggedTx returns the screening record of a transaction the anomaly
  // scoring flagged, if it is still kept.
  rpc FlaggedTx(QueryFlaggedTxRequest) returns (QueryFlaggedTxResponse) {
    option (google.api.http).get = "/qorechain/ai/v1/flagged/{tx_hash}";
  }

  // The four Node* queries are node-local advisory answers from the x/ai
  // heuristic engines (fraud detector, fee and network optimisers, router).
  // They read the node's latest committed state and block statistics the node
  // collected while it was running, use floating point, and are never part of
  // consensus: two nodes may answer slightly differently, and a node that
  // restarted has less history. Do not use them to decide anything on chain.

  // NodeFraudCheck runs the six-layer fraud detector on a hypothetical
  // transaction against the sender's recent screening history.
  rpc NodeFraudCheck(QueryNodeFraudCheckRequest) returns (QueryNodeFraudCheckResponse) {
    option (google.api.http).get = "/qorechain/ai/v1/node/fraud_check";
  }
  // NodeFeeEstimate suggests a fee for an urgency (low, medium, high,
  // urgent) from the congestion this node has observed.
  rpc NodeFeeEstimate(QueryNodeFeeEstimateRequest) returns (QueryNodeFeeEstimateResponse) {
    option (google.api.http).get = "/qorechain/ai/v1/node/fee_estimate";
  }
  // NodeNetworkRecommendations lists parameter suggestions from the network
  // state this node has observed. Advisory only: nothing applies them.
  rpc NodeNetworkRecommendations(QueryNodeNetworkRecommendationsRequest) returns (QueryNodeNetworkRecommendationsResponse) {
    option (google.api.http).get = "/qorechain/ai/v1/node/network_recommendations";
  }
  // NodeRoute returns the heuristic router's priority for a transaction.
  rpc NodeRoute(QueryNodeRouteRequest) returns (QueryNodeRouteResponse) {
    option (google.api.http).get = "/qorechain/ai/v1/node/route";
  }
}

message ConfigView {
  string anomaly_threshold = 1;
  string routing_strategy = 2;
  string risk_threshold = 3;
  int32 max_tx_per_minute = 4;
  // max_evm_tx_per_minute is the EVM-lane limit; zero means max_tx_per_minute.
  int32 max_evm_tx_per_minute = 5;
  // anomaly_action is "flag" (the default when empty) or "reject".
  string anomaly_action = 6;
}

message StatsView {
  uint64 txs_routed = 1;
  uint64 anomalies_detected = 2;
  uint64 contracts_scored = 3;
  uint64 txs_flagged = 4;
  uint64 txs_rejected = 5;
}

message QueryConfigRequest {}
message QueryConfigResponse { ConfigView config = 1; }

message QueryStatsRequest {}
message QueryStatsResponse { StatsView stats = 1; }

// FlaggedTxView is a flagged transaction's screening record.
message FlaggedTxView {
  string tx_hash = 1;
  // anomaly_score is the score in [0, 1] as a decimal string.
  string anomaly_score = 2;
  repeated string flags = 3;
  int64 height = 4;
}

message QueryFlaggedTxRequest { string tx_hash = 1; }
message QueryFlaggedTxResponse {
  bool found = 1;
  FlaggedTxView flagged = 2;
}

message QueryNodeFraudCheckRequest {
  string sender = 1;
  string receiver = 2;
  uint64 amount = 3;
  // tx_type: transfer, delegate, contract_deploy or contract_call.
  string tx_type = 4;
  uint64 gas = 5;
}
message QueryNodeFraudCheckResponse {
  string threat_level = 1;
  string threat_type = 2;
  string action = 3;
  string confidence = 4;
  string details = 5;
  int64 height = 6;
  bool node_local = 7;
}

message QueryNodeFeeEstimateRequest { string urgency = 1; }
message QueryNodeFeeEstimateResponse {
  string suggested_fee = 1;
  int64 estimated_blocks = 2;
  string current_congestion = 3;
  string predicted_congestion = 4;
  string confidence = 5;
  int64 blocks_observed = 6;
  bool node_local = 7;
}

message QueryNodeNetworkRecommendationsRequest {}
message NodeNetworkRecommendation {
  string parameter = 1;
  string current_value = 2;
  string suggested_value = 3;
  string expected_impact = 4;
  string confidence = 5;
  string reasoning = 6;
}
message QueryNodeNetworkRecommendationsResponse {
  repeated NodeNetworkRecommendation recommendations = 1;
  int64 blocks_observed = 2;
  bool node_local = 3;
}

message QueryNodeRouteRequest {
  string sender = 1;
  uint64 amount = 2;
  string tx_type = 3;
}
message QueryNodeRouteResponse {
  int32 priority = 1;
  string reason = 2;
  string confidence = 3;
  repeated string preferred_validators = 4;
  bool node_local = 5;
}
