syntax = "proto3";
package qorechain.svm.v1;

option go_package = "github.com/qorechain/qorechain-core/x/svm/types";

import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";

service Msg {
  option (cosmos.msg.v1.service) = true;
  rpc DeployProgram(MsgDeployProgram) returns (MsgDeployProgramResponse);
  rpc CreateAccount(MsgCreateAccount) returns (MsgCreateAccountResponse);
  rpc ExecuteProgram(MsgExecuteProgram) returns (MsgExecuteProgramResponse);
  rpc RegisterSVMPQCKey(MsgRegisterSVMPQCKey) returns (MsgRegisterSVMPQCKeyResponse);
  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);
}

message MsgDeployProgram {
  option (cosmos.msg.v1.signer) = "sender";
  string sender = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  bytes bytecode = 2;
}
message MsgDeployProgramResponse {
  bytes program_id = 1 [(gogoproto.customtype) = "Bytes32", (gogoproto.nullable) = false, (gogoproto.customname) = "ProgramID"];
}

message MsgCreateAccount {
  option (cosmos.msg.v1.signer) = "sender";
  string sender = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  bytes owner = 2 [(gogoproto.customtype) = "Bytes32", (gogoproto.nullable) = false];
  uint64 space = 3;
  uint64 lamports = 4;
  bytes salt = 5;
}
message MsgCreateAccountResponse {}

message SvmAccountMeta {
  bytes address = 1 [(gogoproto.customtype) = "Bytes32", (gogoproto.nullable) = false];
  bool is_signer = 2;
  bool is_writable = 3;
}

// SVMAuth carries a foreign-scheme (e.g. Phantom ed25519) authorization for an
// SVM action. When present on MsgExecuteProgram, the EFFECTIVE SVM signer is the
// canonical account this key authenticates (verified on-chain), NOT the Cosmos
// `sender` — so any funded account may relay a Phantom-authorized action through
// consensus while the foreign key remains the authority.
message SVMAuth {
  string scheme = 1;            // "ed25519" | "secp256k1"
  bytes pubkey = 2;
  bytes signature = 3;
  bytes recent_blockhash = 4;   // raw 32-byte recent blockhash
}

message MsgExecuteProgram {
  option (cosmos.msg.v1.signer) = "sender";
  string sender = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  bytes program_id = 2 [(gogoproto.customtype) = "Bytes32", (gogoproto.nullable) = false, (gogoproto.customname) = "ProgramID"];
  repeated SvmAccountMeta accounts = 3 [(gogoproto.nullable) = false];
  bytes data = 4;
  SVMAuth auth = 5;             // optional foreign-scheme authorization (relayed)
}
message MsgExecuteProgramResponse {
  bytes result = 1;
}

message MsgRegisterSVMPQCKey {
  option (cosmos.msg.v1.signer) = "sender";
  string sender = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  bytes svm_addr = 2 [(gogoproto.customtype) = "Bytes32", (gogoproto.nullable) = false, (gogoproto.customname) = "SVMAddr"];
  bytes pqc_pub_key = 3 [(gogoproto.customname) = "PQCPubKey"];
}
message MsgRegisterSVMPQCKeyResponse {}

// SVMParams mirrors the module's runtime parameters so governance can replace
// them wholesale. The store keeps them as JSON, so the handler converts.
message SVMParams {
  uint64 max_program_size = 1;
  uint64 max_account_data_size = 2;
  uint64 compute_budget_max = 3;
  uint64 lamports_per_byte = 4;
  string rent_exemption_multi = 5 [
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];
  bool enabled = 6;
  int64 svm_slot_offset = 7;
  uint32 default_sig_scheme = 8;
  uint32 max_cpi = 9;
}

// MsgUpdateParams replaces the SVM runtime parameters wholesale.
//
// WHY THIS EXISTS. Until now x/svm had no governance message at all, so there was
// no transaction that could turn the lane off. When the August 2026 incident
// required closing it, the only available guarantee was a compile-time constant
// (SVMLaneHardDisabled), which means every later change of mind costs a binary
// release and a coordinated upgrade. With this message, disabling the lane is a
// governance proposal like any other.
message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "authority";

  // authority must be the governance module account.
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  SVMParams params = 2 [(gogoproto.nullable) = false];
}

message MsgUpdateParamsResponse {}
