syntax = "proto3";
package qorechain.inflation.v1;

option go_package = "github.com/qorechain/qorechain-core/x/inflation/types";

import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";

// Msg defines the inflation module's transaction service.
//
// Before this service existed the emission schedule was hard-coded: changing it
// required shipping a new binary. UpdateParams makes it a governance parameter,
// so the rate can be adjusted by a vote rather than by an upgrade.
service Msg {
  option (cosmos.msg.v1.service) = true;

  // UpdateParams sets the inflation parameters. Governance-only.
  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);
}

// Tier is one year's inflation rate in the schedule.
message Tier {
  uint64 year = 1;
  string inflation_rate = 2 [
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];
}

// MsgUpdateParams replaces the inflation parameters wholesale.
message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "authority";

  // authority must be the governance module account.
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // schedule is used when emission_mode is "schedule".
  repeated Tier schedule = 2 [(gogoproto.nullable) = false];

  // epoch_length is the number of blocks per emission epoch.
  int64 epoch_length = 3;

  bool enabled = 4;

  // emission_mode is "schedule" (share of supply), "fixed" (constant amount)
  // or, from v3.2.4, "target_apy" (what the bonded stake needs to earn
  // target_apy_bps through the fee split).
  string emission_mode = 5;

  // fixed_epoch_emission is the uqor minted per epoch in "fixed" mode.
  string fixed_epoch_emission = 6 [
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];

  // max_total_emission caps cumulative minting. Zero means uncapped. This is
  // what turns an allocation into a ceiling rather than a target.
  string max_total_emission = 7 [
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];

  // target_apy_bps is the yearly gross staker yield "target_apy" mode aims
  // for, in basis points of the bonded stake (1667 is about 15% net at a 10%
  // commission). Required, and at most 10000, in that mode.
  uint64 target_apy_bps = 8;
}

message MsgUpdateParamsResponse {}
