syntax = "proto3";
package qorechain.abstractaccount.v1;

option go_package = "github.com/qorechain/qorechain-core/x/abstractaccount/types";

import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";
import "cosmos/base/v1beta1/coin.proto";

// SpendingRule defines spending limits for an abstract account.
message SpendingRule {
  string id = 1 [(gogoproto.customname) = "ID"];
  int64 daily_limit = 2;
  int64 per_tx_limit = 3;
  repeated string allowed_denoms = 4;
  bool enabled = 5;
}

// Msg defines the abstractaccount module's transaction service.
service Msg {
  option (cosmos.msg.v1.service) = true;

  rpc CreateAbstractAccount(MsgCreateAbstractAccount) returns (MsgCreateAbstractAccountResponse);
  rpc UpdateSpendingRules(MsgUpdateSpendingRules) returns (MsgUpdateSpendingRulesResponse);
  rpc RegisterAuthenticator(MsgRegisterAuthenticator) returns (MsgRegisterAuthenticatorResponse);
  rpc RevokeAuthenticator(MsgRevokeAuthenticator) returns (MsgRevokeAuthenticatorResponse);
  rpc ExecuteEVM(MsgExecuteEVM) returns (MsgExecuteEVMResponse);
  rpc ExecuteCosmos(MsgExecuteCosmos) returns (MsgExecuteCosmosResponse);
}

message MsgCreateAbstractAccount {
  option (cosmos.msg.v1.signer) = "owner";
  string owner = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string account_type = 2;
}
message MsgCreateAbstractAccountResponse {
  string address = 1;
}

message MsgUpdateSpendingRules {
  option (cosmos.msg.v1.signer) = "owner";
  string owner = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string account_address = 2;
  repeated SpendingRule rules = 3 [(gogoproto.nullable) = false];
}
message MsgUpdateSpendingRulesResponse {}

// MsgRegisterAuthenticator links a foreign-scheme wallet key (e.g. a Phantom
// ed25519 key) to an account so it may act for that account under least-privilege,
// time-bounded, revocable terms. Only the account owner (root key) may call it.
message MsgRegisterAuthenticator {
  option (cosmos.msg.v1.signer) = "owner";
  string owner = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string account_address = 2;
  string scheme = 3;               // "ed25519" | "secp256k1"
  bytes pubkey = 4;                // raw public key bytes
  repeated string permissions = 5; // e.g. "svm", "send"
  int64 expiry_unix = 6;           // unix seconds; must be within MaxSessionTTL
  string label = 7;
}
message MsgRegisterAuthenticatorResponse {}

// MsgRevokeAuthenticator instantly disables a previously linked wallet key.
// Only the account owner (root key) may call it.
message MsgRevokeAuthenticator {
  option (cosmos.msg.v1.signer) = "owner";
  string owner = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string account_address = 2;
  string scheme = 3;
  bytes pubkey = 4;
}
message MsgRevokeAuthenticatorResponse {}

// MsgExecuteEVM executes an EVM call/transfer authorized by a linked
// authenticator (v3.1.85). The relayer submits + pays fees; the authenticator
// (scheme,pubkey) signs the domain-separated sign-bytes binding chain-id, the
// canonical account, the pubkey, to/value/data and the account's expected EVM
// nonce (replay protection — the nonce must equal the account's current EVM
// nonce, and executing the call increments it, so a signature cannot be replayed).
// The chain resolves the authenticator, checks the "evm" permission + SpendingRule
// against `value`, then executes the call FROM the canonical account's EVM address.
message MsgExecuteEVM {
  option (cosmos.msg.v1.signer) = "relayer";
  string relayer = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string account = 2;   // bech32 canonical account (the authenticator's owner)
  string scheme = 3;    // "ed25519" | "secp256k1"
  bytes pubkey = 4;     // authenticator public key
  bytes signature = 5;  // authenticator signature over the EVM auth sign-bytes
  string to = 6;        // 0x-hex recipient/contract; empty = contract create
  string value = 7;     // native QOR amount in wei (aqor), decimal string
  bytes data = 8;       // EVM calldata
  uint64 gas_limit = 9;
  uint64 nonce = 10;    // MUST equal the account's current EVM nonce
}
message MsgExecuteEVMResponse {
  bool success = 1;
  bytes ret = 2;
  uint64 gas_used = 3;
  string vm_error = 4;
}

// MsgExecuteCosmos executes a Native-lane (Cosmos) bank transfer authorized by a
// linked authenticator (v3.1.85). It is the Native counterpart of MsgExecuteEVM:
// the relayer submits + pays fees and signs the outer tx (so the account's own
// PQC-required signature is not needed — the relayer's hybrid-PQC signature
// satisfies the ante on the envelope), while the authenticator (scheme,pubkey)
// signs the domain-separated sign-bytes binding chain-id, the canonical account,
// the pubkey, the recipient, the amount and a per-authenticator sequence (replay:
// nonce must equal the account+key's current sequence, incremented on success).
// The chain resolves the authenticator, checks the "send" permission + SpendingRule
// against `amount`, then moves the coins FROM the canonical account via x/bank.
// This lets an external key (Phantom ed25519 / EVM secp256k1) spend native QOR from
// a PQC-required account under least-privilege, spend-limited, revocable terms.
message MsgExecuteCosmos {
  option (cosmos.msg.v1.signer) = "relayer";
  string relayer = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string account = 2;   // bech32 canonical account (the authenticator's owner)
  string scheme = 3;    // "ed25519" | "secp256k1"
  bytes pubkey = 4;     // authenticator public key
  bytes signature = 5;  // authenticator signature over the Cosmos auth sign-bytes
  string to = 6 [(cosmos_proto.scalar) = "cosmos.AddressString"]; // bech32 recipient
  repeated cosmos.base.v1beta1.Coin amount = 7 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins"
  ];
  uint64 nonce = 8;     // MUST equal the account+key's current authenticator sequence
}
message MsgExecuteCosmosResponse {
  bool success = 1;
}
