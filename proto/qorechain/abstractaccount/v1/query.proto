syntax = "proto3";
package qorechain.abstractaccount.v1;

import "google/api/annotations.proto";

option go_package = "github.com/qorechain/qorechain-core/x/abstractaccount/types";

// Query defines the gRPC query service for the abstractaccount module.
service Query {
  // Config returns the module config.
  rpc Config(QueryConfigRequest) returns (QueryConfigResponse) {
    option (google.api.http).get = "/qorechain/abstractaccount/v1/config";
  }
  // Account returns a single abstract account by address.
  rpc Account(QueryAccountRequest) returns (QueryAccountResponse) {
    option (google.api.http).get = "/qorechain/abstractaccount/v1/accounts/{address}";
  }
  // Accounts lists all abstract accounts.
  rpc Accounts(QueryAccountsRequest) returns (QueryAccountsResponse) {
    option (google.api.http).get = "/qorechain/abstractaccount/v1/accounts";
  }
  // PermissionSchema returns the canonical authenticator permission taxonomy so
  // clients (QoreX/dashboard/relayer) validate scopes without hardcoding strings
  // and detect drift via schema_version (v3.1.85).
  rpc PermissionSchema(QueryPermissionSchemaRequest) returns (QueryPermissionSchemaResponse) {
    option (google.api.http).get = "/qorechain/abstractaccount/v1/permission_schema";
  }
}

message ConfigView {
  bool enabled = 1;
  int32 max_session_keys = 2;
  int32 max_spending_rules = 3;
  int64 default_session_ttl = 4;
}

message AccountView {
  string address = 1;
  string contract_address = 2;
  string account_type = 3;
  uint32 spending_rules_count = 4;
  uint32 session_keys_count = 5;
  int64 created_at = 6;
  string owner = 7;
}

message QueryConfigRequest {}
message QueryConfigResponse { ConfigView config = 1; }

message QueryAccountRequest { string address = 1; }
message QueryAccountResponse { AccountView account = 1; }

message QueryAccountsRequest {}
message QueryAccountsResponse { repeated AccountView accounts = 1; }

message QueryPermissionSchemaRequest {}
message QueryPermissionSchemaResponse {
  // schema_version bumps whenever the taxonomy or the mapping changes; clients
  // compare it to their embedded copy to detect drift.
  string schema_version = 1;
  // permissions is every valid permission string (e.g. send, evm, svm, all).
  repeated string permissions = 2;
  // msg_permissions maps a message typeURL to the permission it requires.
  map<string, string> msg_permissions = 3;
  // key_management_msgs are typeURLs that are NEVER delegable to a linked key.
  repeated string key_management_msgs = 4;
}
