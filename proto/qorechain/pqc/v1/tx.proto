syntax = "proto3";
package qorechain.pqc.v1;

option go_package = "github.com/qorechain/qorechain-core/x/pqc/types";

import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";

// Msg defines the PQC module's transaction service.
service Msg {
  option (cosmos.msg.v1.service) = true;

  // RegisterPQCKey registers a PQC keypair for an account (legacy v1, defaults to Dilithium-5).
  rpc RegisterPQCKey(MsgRegisterPQCKey) returns (MsgRegisterPQCKeyResponse);

  // RegisterPQCKeyV2 registers a PQC key with explicit algorithm selection.
  rpc RegisterPQCKeyV2(MsgRegisterPQCKeyV2) returns (MsgRegisterPQCKeyV2Response);

  // MigratePQCKey migrates an account's PQC key from one algorithm to another.
  rpc MigratePQCKey(MsgMigratePQCKey) returns (MsgMigratePQCKeyResponse);

  // RotatePQCKey replaces an account's PQC key with a NEW key of the SAME
  // algorithm — for rotating a compromised key or moving a legacy-derived key to
  // the canonical derivation. Dual-signed (old proves ownership, new proves
  // control); needs no active algorithm migration.
  rpc RotatePQCKey(MsgRotatePQCKey) returns (MsgRotatePQCKeyResponse);

  // DeprecateAlgorithm starts the migration period for an algorithm (governance).
  rpc DeprecateAlgorithm(MsgDeprecateAlgorithm) returns (MsgDeprecateAlgorithmResponse);

  // DisableAlgorithm emergency-disables an algorithm (governance).
  rpc DisableAlgorithm(MsgDisableAlgorithm) returns (MsgDisableAlgorithmResponse);

  // OpenEVMWindow authorises the sender's EVM lane for a bounded period.
  // It is a Cosmos-lane message, so it inherits the chain's post-quantum
  // signature requirement: opening a window is impossible without the ML-DSA
  // key, which is what makes the classical key alone insufficient to move funds
  // on the EVM lane.
  rpc OpenEVMWindow(MsgOpenEVMWindow) returns (MsgOpenEVMWindowResponse);

  // CloseEVMWindow revokes the sender's window immediately. From the v3.2.2
  // plan height it also revokes the sender's EIP-7702 delegation consent.
  rpc CloseEVMWindow(MsgCloseEVMWindow) returns (MsgCloseEVMWindowResponse);

  // AuthorizeEVMDelegation records the sender's post-quantum consent to one
  // EIP-7702 delegation: the next type-4 transaction that installs (or, with
  // the zero address, clears) exactly this delegation on the sender's account
  // is admitted, once, before the consent expires. Without it the EVM lane
  // refuses a type-4 transaction that would change the account's code.
  rpc AuthorizeEVMDelegation(MsgAuthorizeEVMDelegation) returns (MsgAuthorizeEVMDelegationResponse);

  // ClearEVMDelegation removes the sender's EIP-7702 delegation directly, on
  // the Cosmos lane, without an EVM transaction, a window or the classical key.
  rpc ClearEVMDelegation(MsgClearEVMDelegation) returns (MsgClearEVMDelegationResponse);
}

// MsgRegisterPQCKey registers a PQC keypair for an account.
// Deprecated: use MsgRegisterPQCKeyV2 which includes algorithm_id.
message MsgRegisterPQCKey {
  option (cosmos.msg.v1.signer) = "sender";

  string sender = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  bytes dilithium_pubkey = 2;
  bytes ecdsa_pubkey = 3 [(gogoproto.customname) = "ECDSAPubkey"];
  string key_type = 4;
}
message MsgRegisterPQCKeyResponse {}

// MsgRegisterPQCKeyV2 registers a PQC key with explicit algorithm selection.
message MsgRegisterPQCKeyV2 {
  option (cosmos.msg.v1.signer) = "sender";

  string sender = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  bytes public_key = 2;
  uint32 algorithm_id = 3 [(gogoproto.casttype) = "AlgorithmID", (gogoproto.customname) = "AlgorithmID"];
  bytes ecdsa_pubkey = 4 [(gogoproto.customname) = "ECDSAPubkey"];
  string key_type = 5;
  // Optional (v3.2.3): the key's signature over
  // "qorechain-pqc-pop-v1|chainid|algo|account|hex(public_key)", proving the
  // owner holds its secret. Verified when present; not required yet.
  bytes proof_of_possession = 6;
}
message MsgRegisterPQCKeyV2Response {}

// MsgMigratePQCKey migrates an account's PQC key, proving ownership of both keys.
message MsgMigratePQCKey {
  option (cosmos.msg.v1.signer) = "sender";

  string sender = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  bytes old_public_key = 2;
  bytes new_public_key = 3;
  uint32 new_algorithm_id = 4 [(gogoproto.casttype) = "AlgorithmID", (gogoproto.customname) = "NewAlgorithmID"];
  bytes old_signature = 5;
  bytes new_signature = 6;
}
message MsgMigratePQCKeyResponse {}

// MsgRotatePQCKey replaces an account's PQC key with a new key of the SAME
// algorithm. Both signatures are over the domain-separated bytes
// "qorechain-pqc-rotate-v1|chainid|algo|account|oldkey|newkey" (no block height —
// the signer cannot predict it). The bytes carry no nonce, so the old key no
// longer matching is NOT enough once a key is reused (A->B->A makes the A->B
// message valid again). From v3.2.3 the chain refuses any rotation or migration
// to a key the account used before, which closes that replay.
message MsgRotatePQCKey {
  option (cosmos.msg.v1.signer) = "sender";

  string sender = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  bytes old_public_key = 2;
  bytes new_public_key = 3;
  bytes old_signature = 4;
  bytes new_signature = 5;
}
message MsgRotatePQCKeyResponse {}

// MsgDeprecateAlgorithm proposes deprecating an algorithm (starts migration period).
message MsgDeprecateAlgorithm {
  option (cosmos.msg.v1.signer) = "authority";

  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint32 algorithm_id = 2 [(gogoproto.casttype) = "AlgorithmID", (gogoproto.customname) = "AlgorithmID"];
  int64 migration_blocks = 3;
  uint32 replacement_algorithm_id = 4 [(gogoproto.casttype) = "AlgorithmID", (gogoproto.customname) = "ReplacementAlgID"];
}
message MsgDeprecateAlgorithmResponse {}

// MsgDisableAlgorithm emergency-disables an algorithm (e.g., vulnerability discovered).
message MsgDisableAlgorithm {
  option (cosmos.msg.v1.signer) = "authority";

  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint32 algorithm_id = 2 [(gogoproto.casttype) = "AlgorithmID", (gogoproto.customname) = "AlgorithmID"];
  string reason = 3;
}
message MsgDisableAlgorithmResponse {}

// MsgOpenEVMWindow authorises EVM-lane transactions from the sender for a
// bounded number of transactions, a bounded total outflow, and a bounded number
// of blocks. Opening replaces any existing window rather than adding to it.
message MsgOpenEVMWindow {
  option (cosmos.msg.v1.signer) = "sender";

  string sender = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  // blocks is how long the window stays open, counted from the block that
  // opens it. Bounded by the module's maximum.
  uint64 blocks = 2;
  // max_txs is how many EVM transactions the window admits. Zero is rejected:
  // a window that admits nothing is a mistake, not a policy.
  uint64 max_txs = 3;
  // max_value is the total the window admits, in uqor, counting transferred
  // value AND the maximum fee each transaction could pay. Both drain the
  // account, so both are bounded.
  string max_value = 4 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];
  // native_only, when true, narrows the window to plain transfers of native
  // QOR: it refuses calldata, contract creation, a recipient that carries
  // code, and EIP-7702 authorizations. Optional; absent keeps the window's
  // original scope. Honoured from the evm-pqc-window-targets feature on.
  bool native_only = 5;
  // allowed_targets, when non-empty, narrows the window to transactions whose
  // recipient is one of these 0x-prefixed 20-byte addresses; contract
  // creation is refused. Optional; absent keeps the window's original scope.
  // Honoured from the evm-pqc-window-targets feature on.
  repeated string allowed_targets = 6;
}
message MsgOpenEVMWindowResponse {
  uint64 expiry_height = 1;
}

message MsgCloseEVMWindow {
  option (cosmos.msg.v1.signer) = "sender";
  string sender = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}
message MsgCloseEVMWindowResponse {}

// MsgAuthorizeEVMDelegation is the account's post-quantum consent to one
// EIP-7702 delegation of its own account. It is single-use, bounded in time,
// replaces any earlier consent, and is revoked by MsgCloseEVMWindow.
message MsgAuthorizeEVMDelegation {
  option (cosmos.msg.v1.signer) = "sender";

  string sender = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  // delegate is the 0x-prefixed 20-byte address the authorization tuple
  // names. The zero address consents to clearing the delegation.
  string delegate = 2;
  // blocks is how long the consent stays usable, counted from the block that
  // records it. Bounded by the module's maximum.
  uint64 blocks = 3;
}
message MsgAuthorizeEVMDelegationResponse {
  uint64 expiry_height = 1;
}

// MsgClearEVMDelegation removes the sender's EIP-7702 delegation designator.
message MsgClearEVMDelegation {
  option (cosmos.msg.v1.signer) = "sender";
  string sender = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}
message MsgClearEVMDelegationResponse {}
