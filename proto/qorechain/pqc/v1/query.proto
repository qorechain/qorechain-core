syntax = "proto3";
package qorechain.pqc.v1;

option go_package = "github.com/qorechain/qorechain-core/x/pqc/types";

import "google/api/annotations.proto";

// Query defines the gRPC query service for the PQC module.
service Query {
  // Account returns the registered PQC key information for an address.
  rpc Account(QueryAccountRequest) returns (QueryAccountResponse) {
    option (google.api.http).get = "/qorechain/pqc/v1/account/{address}";
  }

  // EVMWindow returns an address's open EVM-lane authorisation window, if any,
  // with what remains of it at the current height.
  rpc EVMWindow(QueryEVMWindowRequest) returns (QueryEVMWindowResponse) {
    option (google.api.http).get = "/qorechain/pqc/v1/evm_window/{address}";
  }

  // EVMDelegationConsent returns an address's EIP-7702 delegation consent, if
  // any, together with what a client needs to sign the matching authorization
  // tuple: the account's current delegation and EVM nonce.
  rpc EVMDelegationConsent(QueryEVMDelegationConsentRequest) returns (QueryEVMDelegationConsentResponse) {
    option (google.api.http).get = "/qorechain/pqc/v1/evm_delegation_consent/{address}";
  }

  // ProtocolFeatures lists every protocol feature this binary knows, released
  // or staged, with whether it is enabled at the current height, followed by
  // any enabled feature this binary does not know.
  rpc ProtocolFeatures(QueryProtocolFeaturesRequest) returns (QueryProtocolFeaturesResponse) {
    option (google.api.http).get = "/qorechain/pqc/v1/protocol_features";
  }
}

message QueryProtocolFeaturesRequest {}

message ProtocolFeatureStatus {
  string name = 1;
  // enabled reports whether the switch is on at the current height.
  bool enabled = 2;
  // known is false for a feature recorded as enabled that this binary does
  // not know (a newer release enabled it).
  bool known = 3;
  // staged is true for a feature this binary carries but no release has
  // enabled yet.
  bool staged = 4;
}

message QueryProtocolFeaturesResponse {
  repeated ProtocolFeatureStatus features = 1;
  int64 height = 2;
}

message QueryEVMDelegationConsentRequest {
  // address is bech32 or 0x-prefixed hex.
  string address = 1;
}

message QueryEVMDelegationConsentResponse {
  // found reports whether a consent is stored; live whether it is still usable
  // at the current height.
  bool found = 1;
  bool live = 2;
  // delegate is the 0x address the consent names; the zero address means
  // clearing.
  string delegate = 3;
  uint64 granted_height = 4;
  uint64 expiry_height = 5;
  // current_delegate is the delegation installed on the account now, empty
  // when there is none.
  string current_delegate = 6;
  // nonce is the account's EVM nonce now. A tuple signed for a sponsored
  // transaction carries it; one in the account's own type-4 transaction
  // carries it plus one, because the transaction's own nonce is consumed
  // first.
  uint64 nonce = 7;
}

message QueryEVMWindowRequest {
  string address = 1;
}

message QueryEVMWindowResponse {
  // found reports whether a window is stored. A stored window may still be
  // exhausted or expired; check live.
  bool found = 1;
  // live reports whether the window admits at least one more transaction of
  // zero value at the current height.
  bool live = 2;
  uint64 opened_height = 3;
  uint64 expiry_height = 4;
  uint64 max_txs = 5;
  uint64 used_txs = 6;
  string max_value = 7;
  string used_value = 8;
  // remaining_blocks, remaining_txs and remaining_value say which bound is
  // closest to running out, so a refused caller can tell why.
  uint64 remaining_blocks = 9;
  uint64 remaining_txs = 10;
  string remaining_value = 11;
  // native_only and allowed_targets report the window's scope, as opened.
  bool native_only = 12;
  repeated string allowed_targets = 13;
}

message QueryAccountRequest {
  // address is the bech32 account address whose PQC key is requested.
  string address = 1;
}

message QueryAccountResponse {
  // found reports whether the account has a registered PQC key.
  bool found = 1;
  PQCAccountView account = 2;
}

// PQCAccountView is the query-facing view of a registered PQC account.
message PQCAccountView {
  string address = 1;
  bytes public_key = 2;
  uint32 algorithm_id = 3;
  string algorithm_name = 4;
  bytes ecdsa_pubkey = 5;
  string key_type = 6;
  int64 created_at_height = 7;
  bytes migration_public_key = 8;
  uint32 migration_algorithm_id = 9;
  // classical_key_source says where ecdsa_pubkey comes from: "stored" (the key
  // given at registration), "auth_account" (nothing was stored, so this is the
  // account's on-chain public key) or "none" (neither exists yet).
  string classical_key_source = 10;
  // possession_proven is true when the current key was proven by a proof of
  // possession: a registration carrying a valid proof_of_possession, or a
  // rotation or migration (both verify a signature by the new key). False for
  // a key registered without a proof, and for every record from before v3.2.4.
  // A key without it may be one whose secret the account does not hold.
  bool possession_proven = 11;
}
