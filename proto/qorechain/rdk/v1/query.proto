syntax = "proto3";
package qorechain.rdk.v1;

option go_package = "github.com/qorechain/qorechain-core/x/rdk/types";

import "google/api/annotations.proto";

// Query defines the gRPC query service for the rdk (rollup) module.
//
// Every RPC is also served over REST by the gRPC gateway, under
// /qorechain/rdk/v1/. Rollup ids are restricted to [a-z0-9._-] from v3.2.2,
// so an id is always a single clean path segment.
service Query {
  // Params returns the module parameters.
  rpc Params(QueryParamsRequest) returns (QueryParamsResponse) {
    option (google.api.http).get = "/qorechain/rdk/v1/params";
  }
  // Rollup returns a single rollup config by ID.
  rpc Rollup(QueryRollupRequest) returns (QueryRollupResponse) {
    option (google.api.http).get = "/qorechain/rdk/v1/rollup/{rollup_id}";
  }
  // Rollups lists all rollups.
  rpc Rollups(QueryRollupsRequest) returns (QueryRollupsResponse) {
    option (google.api.http).get = "/qorechain/rdk/v1/rollups";
  }
  // Batch returns a settlement batch by (rollup_id, batch_index).
  rpc Batch(QueryBatchRequest) returns (QueryBatchResponse) {
    option (google.api.http).get = "/qorechain/rdk/v1/batch/{rollup_id}/{batch_index}";
  }
  // LatestBatch returns the latest settlement batch for a rollup.
  rpc LatestBatch(QueryLatestBatchRequest) returns (QueryLatestBatchResponse) {
    option (google.api.http).get = "/qorechain/rdk/v1/latest_batch/{rollup_id}";
  }
  // Batches lists a rollup's settlement batches in index order, starting at
  // start_index, at most limit of them (default 50, maximum 100).
  rpc Batches(QueryBatchesRequest) returns (QueryBatchesResponse) {
    option (google.api.http).get = "/qorechain/rdk/v1/batches/{rollup_id}";
  }
  // Blob returns a data-availability blob's metadata (not its data).
  rpc Blob(QueryBlobRequest) returns (QueryBlobResponse) {
    option (google.api.http).get = "/qorechain/rdk/v1/blob/{rollup_id}/{blob_index}";
  }
}

// ParamsView is the query-facing view of the module parameters.
message ParamsView {
  uint32 max_rollups = 1;
  int64 min_stake_for_rollup = 2;
  string rollup_creation_burn_rate = 3;
  uint64 default_challenge_window = 4;
  uint64 max_da_blob_size = 5;
  uint64 blob_retention_blocks = 6;
  uint32 max_batches_per_block = 7;
}

// RollupView is the query-facing view of a rollup config (scalar fields).
message RollupView {
  string rollup_id = 1;
  string creator = 2;
  string profile = 3;
  string settlement_mode = 4;
  string da_backend = 5;
  uint64 block_time_ms = 6;
  uint64 max_tx_per_block = 7;
  string vm_type = 8;
  string status = 9;
  int64 stake_amount = 10;
  string layer_id = 11;
  int64 created_height = 12;
  // escrow_balance is what the rollup still holds in the pooled module
  // escrow, in uqor: what its withdrawals can still pay and what stopping it
  // refunds. It is read from the per-rollup escrow ledger (from v3.2.3).
  uint64 escrow_balance = 13;
}

// BatchView is the query-facing view of a settlement batch.
message BatchView {
  string rollup_id = 1;
  uint64 batch_index = 2;
  string state_root = 3;
  string prev_state_root = 4;
  uint64 tx_count = 5;
  string data_hash = 6;
  string proof_type = 7;
  string status = 8;
  int64 submitted_at = 9;
  int64 finalized_at = 10;
  string withdrawals_root = 11;
}

message QueryParamsRequest {}
message QueryParamsResponse { ParamsView params = 1; }

message QueryRollupRequest { string rollup_id = 1; }
message QueryRollupResponse { RollupView rollup = 1; }

message QueryRollupsRequest {}
message QueryRollupsResponse { repeated RollupView rollups = 1; }

message QueryBatchRequest {
  string rollup_id = 1;
  uint64 batch_index = 2;
}
message QueryBatchResponse { BatchView batch = 1; }

message QueryLatestBatchRequest { string rollup_id = 1; }
message QueryLatestBatchResponse { BatchView batch = 1; }

message QueryBatchesRequest {
  string rollup_id = 1;
  // start_index is the first batch index returned.
  uint64 start_index = 2;
  // limit caps the number of batches returned: 0 means 50, and more than 100
  // is capped at 100.
  uint32 limit = 3;
}
message QueryBatchesResponse {
  repeated BatchView batches = 1;
  // next_index is the start_index of the next page, 0 when there is none.
  uint64 next_index = 2;
}

// BlobView is the query-facing view of a data-availability blob, without the
// blob data itself.
message BlobView {
  string rollup_id = 1;
  uint64 blob_index = 2;
  string commitment = 3;
  uint64 data_size = 4;
  int64 height = 5;
  string stored_at = 6;
  bool pruned = 7;
  // expires_at_height is the height after which the blob may be pruned.
  int64 expires_at_height = 8;
}

message QueryBlobRequest {
  string rollup_id = 1;
  uint64 blob_index = 2;
}
message QueryBlobResponse { BlobView blob = 1; }
