syntax = "proto3";
package qorechain.lightnode.v1;

option go_package = "github.com/qorechain/qorechain-core/x/lightnode/types";

import "google/api/annotations.proto";

// Query defines the lightnode module's gRPC query service.
service Query {
  // LightNode returns a single light node by operator address.
  rpc LightNode(QueryLightNodeRequest) returns (QueryLightNodeResponse) {
    option (google.api.http).get = "/qorechain/lightnode/v1/node/{address}";
  }
  // LightNodes lists all registered light nodes.
  rpc LightNodes(QueryLightNodesRequest) returns (QueryLightNodesResponse) {
    option (google.api.http).get = "/qorechain/lightnode/v1/nodes";
  }
  // Params returns the lightnode module parameters.
  rpc Params(QueryParamsRequest) returns (QueryParamsResponse) {
    option (google.api.http).get = "/qorechain/lightnode/v1/params";
  }
  // Rewards returns an operator's accumulated (claimable) rewards.
  rpc Rewards(QueryRewardsRequest) returns (QueryRewardsResponse) {
    option (google.api.http).get = "/qorechain/lightnode/v1/rewards/{address}";
  }
  // Stats returns module-level light node statistics.
  rpc Stats(QueryStatsRequest) returns (QueryStatsResponse) {
    option (google.api.http).get = "/qorechain/lightnode/v1/stats";
  }
  // RewardPool returns how the module account balance is split between the
  // reserved pool, rewards owed to operators, and what is distributable.
  rpc RewardPool(QueryRewardPoolRequest) returns (QueryRewardPoolResponse) {
    option (google.api.http).get = "/qorechain/lightnode/v1/reward_pool";
  }
}

// LightNodeView is a flat representation of a registered light node.
message LightNodeView {
  string address = 1;
  string node_type = 2;
  string version = 3;
  repeated string capabilities = 4;
  string status = 5;
  int64 registered_at = 6;
  int64 last_heartbeat = 7;
  uint64 total_heartbeats = 8;
  uint64 expected_heartbeats = 9;
  string delegated_stake = 10;
  string accumulated_rewards = 11;
  int64 initial_heartbeat_interval = 12;
}

message QueryLightNodeRequest { string address = 1; }
message QueryLightNodeResponse { LightNodeView node = 1; bool found = 2; }

message QueryLightNodesRequest {}
message QueryLightNodesResponse { repeated LightNodeView nodes = 1; }

message QueryParamsRequest {}
message QueryParamsResponse {
  string registration_fee = 1;
  int64 heartbeat_interval = 2;
  string min_delegated_stake = 3;
  string reward_share = 4;
  string min_uptime_for_rewards = 5;
  uint64 max_light_nodes = 6;
  int64 heartbeat_grace_period = 7;
}

message QueryRewardsRequest { string address = 1; }
message QueryRewardsResponse { string accumulated_rewards = 1; }

message QueryStatsRequest {}
message QueryStatsResponse {
  uint64 total_registered = 1;
  uint64 total_active = 2;
  string total_rewards = 3;
  int64 last_reward_height = 4;
}

message QueryRewardPoolRequest {}
message QueryRewardPoolResponse {
  // balance is the module account's total uqor holding.
  string balance = 1;
  // reserved accumulated while no node was eligible; it is excluded from
  // distribution and moves only by governance.
  string reserved = 2;
  // outstanding is credited to operators but not yet claimed.
  string outstanding = 3;
  // payable is reserve that governance released back into distribution; it
  // drains to operators over time at the capped rate.
  string payable = 5;
  // max_reward_per_block_per_node bounds what one node may be credited per block.
  string max_reward_per_block_per_node = 6;
  // distributable is what the next distribution run may hand out:
  // balance - reserved - outstanding.
  string distributable = 4;
  // initialized reports whether the split has been established by the
  // coordinated upgrade handler. Until it is, the figures above describe a raw
  // balance that the module does not yet account for, and clients that gate on
  // the accounting being live (the licence batch tool) must treat the pool as
  // not ready.
  bool initialized = 7;
}
