syntax = "proto3";
package qorechain.lightnode.v1;

option go_package = "github.com/qorechain/qorechain-core/x/lightnode/types";

import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";

// Msg defines the lightnode module's transaction service.
service Msg {
  option (cosmos.msg.v1.service) = true;

  rpc RegisterLightNode(MsgRegisterLightNode) returns (MsgRegisterLightNodeResponse);
  rpc Heartbeat(MsgHeartbeat) returns (MsgHeartbeatResponse);
  rpc DeregisterLightNode(MsgDeregisterLightNode) returns (MsgDeregisterLightNodeResponse);
  rpc ClaimLightNodeRewards(MsgClaimLightNodeRewards) returns (MsgClaimLightNodeRewardsResponse);
  // ReleaseReserve moves part of the reserved reward pool. Governance-only.
  rpc ReleaseReserve(MsgReleaseLightNodeReserve) returns (MsgReleaseLightNodeReserveResponse);
}

message MsgRegisterLightNode {
  option (cosmos.msg.v1.signer) = "operator";
  string operator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string node_type = 2;
  string version = 3;
  repeated string capabilities = 4;
}
message MsgRegisterLightNodeResponse {}

message MsgHeartbeat {
  option (cosmos.msg.v1.signer) = "operator";
  string operator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}
message MsgHeartbeatResponse {}

message MsgDeregisterLightNode {
  option (cosmos.msg.v1.signer) = "operator";
  string operator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}
message MsgDeregisterLightNodeResponse {}

message MsgClaimLightNodeRewards {
  option (cosmos.msg.v1.signer) = "operator";
  string operator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}
message MsgClaimLightNodeRewardsResponse {}

// MsgReleaseLightNodeReserve releases part of the reserved light-node reward
// pool: the balance that accumulated in the module account while no node was
// eligible to receive it. Nobody earned it, so it is excluded from the ordinary
// proportional distribution and moves only by a governance vote.
message MsgReleaseLightNodeReserve {
  option (cosmos.msg.v1.signer) = "authority";

  // authority must be the governance module account.
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // amount is the uqor to release from the reserved pool.
  string amount = 2;

  // destination receives the coins. Leave empty to release the amount into the
  // ordinary light-node reward distribution instead of sending it anywhere.
  string destination = 3 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}
message MsgReleaseLightNodeReserveResponse {}
